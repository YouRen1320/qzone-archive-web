name: 问题报告
description: 报告可复现的问题；请勿提交 Cookie、二维码或未脱敏的个人数据
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先删除截图中的 QQ 号、昵称、二维码、任务 ID 和动态内容。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么，原本期望什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交号
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有上传 QQ Cookie、登录二维码或未脱敏的个人内容
          required: true
