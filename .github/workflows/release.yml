name: Release container

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build public release archive
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: qzone-archive-web:${{ github.ref_name }}
          outputs: type=docker,dest=${{ runner.temp }}/qzone-archive-web-${{ github.ref_name }}-linux-amd64.tar
          cache-from: type=gha
      - name: Compress and checksum release archive
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          gzip --best --no-name "qzone-archive-web-${GITHUB_REF_NAME}-linux-amd64.tar"
          sha256sum "qzone-archive-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz" > SHA256SUMS
      - name: Publish public release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/qzone-archive-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
          checksum="${RUNNER_TEMP}/SHA256SUMS"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${archive}" "${checksum}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" "${archive}" "${checksum}" \
              --generate-notes --title "${GITHUB_REF_NAME}" --verify-tag --repo "${GITHUB_REPOSITORY}"
          fi
