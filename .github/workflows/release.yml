name: 发布容器

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 验证发布标签来自 main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: 登录 GitHub 容器注册表
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: 构建并推送镜像
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 构建公开发布归档
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: qzone-archive-web:${{ github.ref_name }}
          outputs: type=docker,dest=${{ runner.temp }}/qzone-archive-web-${{ github.ref_name }}-linux-amd64.tar
          cache-from: type=gha
      - name: 压缩并校验发布归档
        shell: bash
        run: |
          cd "${RUNNER_TEMP}"
          gzip --best --no-name "qzone-archive-web-${GITHUB_REF_NAME}-linux-amd64.tar"
          sha256sum "qzone-archive-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz" > SHA256SUMS
      - name: 发布公开 Release 产物
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/qzone-archive-web-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
          checksum="${RUNNER_TEMP}/SHA256SUMS"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${archive}" "${checksum}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" "${archive}" "${checksum}" \
              --generate-notes --title "${GITHUB_REF_NAME}" --verify-tag --repo "${GITHUB_REPOSITORY}"
          fi
