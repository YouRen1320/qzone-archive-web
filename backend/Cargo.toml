[package]
name = "qzone-archive-web"
version = "0.1.3"
description = "Privacy-first web interface for exporting authorized QQ Zone history"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/YouRen1320/qzone-archive-web"

[dependencies]
axum = { version = "0.8", features = ["http2", "json", "macros", "tokio"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
cookie = "0.18"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["compression-full", "fs", "request-id", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
